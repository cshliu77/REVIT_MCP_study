name: CI

on:
  push:
    branches:
      - main
      - master
      - Google_Jules_Github_Actions
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-dotnet:
    name: Build Revit Add-in
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore dependencies (2022)
        run: dotnet restore MCP/RevitMCP.csproj

      - name: Build Revit 2022
        run: dotnet build MCP/RevitMCP.csproj -c Release --no-restore

      - name: Restore dependencies (2024)
        run: dotnet restore MCP/RevitMCP.2024.csproj

      - name: Build Revit 2024
        run: dotnet build MCP/RevitMCP.2024.csproj -c Release --no-restore

      - name: Upload Artifacts (2022)
        uses: actions/upload-artifact@v4
        with:
          name: RevitMCP-2022-Build
          path: MCP/bin/Release/

      - name: Upload Artifacts (2024)
        uses: actions/upload-artifact@v4
        with:
          name: RevitMCP-2024-Build
          path: MCP/bin/Release.2024/

  build-node:
    name: Build MCP Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MCP-Server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: MCP-Server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MCP-Server-Build
          path: MCP-Server/build/

  release:
    name: Create Release
    needs: [build-dotnet, build-node]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts (2022)
        uses: actions/download-artifact@v4
        with:
          name: RevitMCP-2022-Build
          path: RevitMCP-2022

      - name: Download Artifacts (2024)
        uses: actions/download-artifact@v4
        with:
          name: RevitMCP-2024-Build
          path: RevitMCP-2024

      - name: Download Artifacts (MCP Server)
        uses: actions/download-artifact@v4
        with:
          name: MCP-Server-Build
          path: MCP-Server

      - name: Zip Artifacts
        run: |
          zip -r RevitMCP-2022.zip RevitMCP-2022
          zip -r RevitMCP-2024.zip RevitMCP-2024
          zip -r MCP-Server.zip MCP-Server

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            RevitMCP-2022.zip
            RevitMCP-2024.zip
            MCP-Server.zip
