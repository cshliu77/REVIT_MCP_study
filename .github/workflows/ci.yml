name: CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ========================================
  # TypeScript MCP Server 編譯
  # ========================================
  build-mcp-server:
    name: Build MCP Server (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MCP-Server/package-lock.json

      - name: 安裝依賴套件
        run: npm ci
        working-directory: MCP-Server

      - name: 編譯 TypeScript
        run: npx tsc
        working-directory: MCP-Server

      - name: 上傳 MCP Server 建置產物
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-build
          path: |
            MCP-Server/build/**/*.js
            MCP-Server/build/**/*.d.ts
            MCP-Server/build/**/*.js.map
          retention-days: 30

  # ========================================
  # C# Revit Add-in 編譯 (多版本矩陣)
  # ========================================
  build-revit-addin:
    name: Build Revit Add-in (${{ matrix.revit-version }})
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - revit-version: '2022'
            project-file: 'MCP/RevitMCP.csproj'
            artifact-name: 'revit-addin-2022'
            output-path: 'MCP/bin/Release/'
          - revit-version: '2024'
            project-file: 'MCP/RevitMCP.2024.csproj'
            artifact-name: 'revit-addin-2024'
            output-path: 'MCP/bin/Release.2024/'

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 設定 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 還原 NuGet 套件
        run: dotnet restore ${{ matrix.project-file }} /p:CI=true

      - name: 編譯 Revit ${{ matrix.revit-version }} Add-in
        run: dotnet build ${{ matrix.project-file }} -c Release --no-restore /p:CI=true

      - name: 上傳 Revit Add-in 建置產物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.output-path }}RevitMCP.dll
            ${{ matrix.output-path }}RevitMCP.pdb
            ${{ matrix.output-path }}Newtonsoft.Json.dll
          retention-days: 30

  # ========================================
  # 建置結果摘要
  # ========================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-mcp-server, build-revit-addin]
    if: always()

    steps:
      - name: 建置結果檢查
        run: |
          echo "=== CI Build Summary ==="
          echo "MCP Server (TypeScript): ${{ needs.build-mcp-server.result }}"
          echo "Revit Add-in: ${{ needs.build-revit-addin.result }}"

          if [ "${{ needs.build-mcp-server.result }}" != "success" ] || [ "${{ needs.build-revit-addin.result }}" != "success" ]; then
            echo "::error::部分建置失敗，請檢查上方日誌"
            exit 1
          fi

          echo "所有建置成功完成！"
